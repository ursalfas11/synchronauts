:root {

  --pad: 16px;
  --gap: 12px;
  --side: 248px;
  --pop: 0 10px 30px light-dark(rgb(0 0 0 / .10), rgb(0 0 0 / .7)), 0 0 0 1px var(--line-strong);
  --sans-base: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: var(--sans-base);
  --zoom: 1;
  --tint: #6d28d9;
  --tint-o: 0%;
  --vh: calc(100dvh / var(--zoom));  /* the zoom of the whole page scales viewport units too */
}
:root[data-font="rounded"] { --sans: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", var(--sans-base); }
:root[data-font="serif"] { --sans: ui-serif, "New York", Charter, "Iowan Old Style", Georgia, serif; }
:root[data-font="mono"] { --sans: var(--mono); }
:root[data-contrast="high"] { --muted: light-dark(#404040, #c2c2c2); --text-2: light-dark(#1a1a1a, #e5e5e5); --line: light-dark(#bdbdbd, #4a4a4a); --line-strong: light-dark(#8a8a8a, #707070); }
:root { zoom: var(--zoom); }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

:root[data-accent="orange"] { --accent: light-dark(#c2410c, #fb923c); }
:root[data-accent="blue"], :root[data-accent="violet"], :root[data-accent="green"], :root[data-accent="orange"] { --on-accent: light-dark(#ffffff, #000000); }

* { box-sizing: border-box; }

/* App shell */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: var(--vh); }
.sidebar {
  position: sticky; top: 0; height: var(--vh); display: flex; flex-direction: column; gap: 6px;

}

}

.count.warn { background: var(--approval); color: #fff; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 12px; border-top: 1px solid var(--line); }
.side-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 10px; font-size: 13px; color: var(--text-2); }

.side-row .lbl { display: inline-flex; align-items: center; gap: 10px; }

  display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 4px; padding: 8px 10px; border: 0; border-radius: 8px;
  background: none; text-align: left; transition: background-color .15s;
}
.side-user:hover { background: var(--hover); }

.side-user-sub { font: 11.5px var(--mono); color: var(--muted); }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); white-space: nowrap; min-width: 0; }

.topbar { display: none; }
.tabbar { display: none; }

.main { min-width: 0; padding: 28px 40px 40px; }
.view { max-width: 1180px; margin: 0 auto; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -.025em; }
.page-head p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.block { margin-bottom: 28px; }
.block-title {
  display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
  font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
}

/* Controls */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button {
  border: 0; background: none; color: var(--muted); font-size: 12.5px; font-weight: 550; padding: 4px 11px; border-radius: 6px;
  transition: background-color .15s, color .15s; white-space: nowrap;
}

  background: var(--line-strong); transition: background-color .2s;
}

  position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .3); transition: transform .2s;
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"] .knob { transform: translateX(16px); background: var(--on-accent); }
select, textarea, input[type="text"] {
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; color: var(--text);
  padding: 7px 10px; font-size: 13.5px; transition: border-color .15s;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px;
  border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  font-size: 13px; font-weight: 600; transition: background-color .15s, border-color .15s, opacity .15s; white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.primary:hover:not(:disabled) { opacity: .88; background: var(--accent); }

.link { background: none; border: 0; padding: 4px 8px; border-radius: 6px; color: var(--accent); font-size: 12.5px; font-weight: 600; transition: background-color .15s; }
.link:hover { background: var(--hover); }
.icon-btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px;

}

.icon-btn svg { width: 17px; height: 17px; }
:disabled { opacity: .5; cursor: not-allowed; }

/* Banners */
.banner {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--radius);
  margin: 0 auto 18px; max-width: 1180px; font-size: 13px; border: 1px solid; overflow-wrap: anywhere;
}
.banner.red { color: var(--error); border-color: color-mix(in srgb, var(--error) 40%, var(--line)); background: color-mix(in srgb, var(--error) 6%, var(--surface)); }

.banner button { margin-left: auto; }

/* Overview: figures */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); margin-bottom: 28px; }
.kpi {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 16px; text-align: left;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text);
}

.kpi-label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; }

.kpi.warn .kpi-value { color: var(--approval); }
.kpi.red .kpi-value { color: var(--error); }
.kpi .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.attn { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.attn-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; font-size: 13.5px; border-top: 1px solid var(--line); background: var(--surface); }
.attn-row:first-child { border-top: 0; }
.attn-row > svg { width: 17px; height: 17px; }
.attn-row.k-warn > svg { color: var(--approval); }
.attn-row.k-red > svg { color: var(--error); }
.attn-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }

/* Missions */
.mission { border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 14px 16px 0; margin-bottom: var(--gap); overflow: hidden; overflow-wrap: anywhere; background: var(--surface); }
.mission.over { border-color: var(--line); padding-bottom: 12px; }
.mission-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.mission-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }

.crew { display: flex; gap: 6px; flex-wrap: wrap; }
.crew-member { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); padding: 2px 9px 2px 3px; border-radius: 999px; border: 1px solid var(--line); }
.crew-member.invited { border-style: dashed; color: var(--muted); }
.crew-member.invited .mini-avatar { filter: grayscale(1); opacity: .6; }
.mission-time { margin-left: auto; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mission-time b { color: var(--text); font-weight: 650; }
.mission .plan { margin: 10px 0 12px; font-size: 14px; line-height: 1.55; }
.mission .result { margin: 0; font-size: 13px; color: var(--text-2); }
.mission-bar { height: 3px; margin: 0 -16px; background: var(--surface-2); }
.mission-bar span { display: block; height: 100%; background: var(--accent); }

/* Overview: people and sessions */
.person { margin-bottom: 24px; }
.person-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.avatar {
  width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; font-size: 12.5px; color: #fff; background: hsl(var(--hue) 42% 46%);
}
.person-name { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 7px; }

.person-info { color: var(--muted); font-size: 12.5px; }

  --state: var(--quiet);

.session.flash { animation: flash 1.8s ease-out; }
@keyframes flash { 0%, 35% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); } }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 22px; }
.state { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 650; color: var(--state); white-space: nowrap; }
.state .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--state); }
.s-working .state .dot { animation: pulse 1.8s ease-out infinite; }

.since { color: var(--muted); font-weight: 450; }
.tag { font-size: 11px; font-weight: 650; border-radius: 5px; padding: 1px 7px; white-space: nowrap; color: var(--muted); border: 1px solid var(--line-strong); }
.tag.codex { color: light-dark(#0f766e, #5eead4); border-color: color-mix(in srgb, currentColor 40%, var(--line)); }
.repo { display: flex; align-items: center; gap: 7px; font: 13px var(--mono); min-width: 0; }
.repo svg { width: 14px; height: 14px; color: var(--muted); }

.branch { color: var(--text-2); background: var(--surface-2); border-radius: 5px; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.task { margin: 0; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }

.files { display: flex; flex-wrap: wrap; gap: 4px; }
.file {
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;

  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

.ov-branch svg { color: var(--amber); }

.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line); }

/* Messages */
.view.fill { display: flex; flex-direction: column; height: calc(var(--vh) - 68px); }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  padding: 16px 2px; border-top: 1px solid var(--line);
}

.mini-avatar { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 8.5px; font-weight: 800; color: #fff; background: hsl(var(--hue) 42% 46%); }
.chip { font: 11px var(--mono); color: var(--text-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.chip.human { font-family: var(--sans); font-weight: 650; color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.seal { display: inline-grid; place-items: center; color: var(--working); }
.seal svg { width: 14px; height: 14px; }
.delivery { font-weight: 700; }
.delivery.ok { color: var(--working); }
.msg.forged { border-color: color-mix(in srgb, var(--error) 55%, var(--line)); }
.msg.forged .msg-text { color: var(--text-2); }
.forged-note { display: flex; gap: 7px; align-items: flex-start; margin: 2px 0 7px; padding: 6px 9px; border-radius: 7px; color: var(--error); background: color-mix(in srgb, var(--error) 9%, transparent); font-size: 12.5px; font-weight: 600; line-height: 1.35; }
.forged-note svg { width: 15px; height: 15px; margin-top: 1px; }
.msg-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.5; }
.composer { flex: none; display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); }
.composer-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.composer-top label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 550; }
.composer-top select { font-weight: 450; color: var(--text); }
.composer textarea { width: 100%; border: 0; padding: 4px 2px; resize: none; min-height: 44px; max-height: 200px; line-height: 1.5; font-size: 14px; background: transparent; }
.composer textarea:focus-visible { outline: none; }
.composer:focus-within { border-color: var(--accent); }
.composer-foot { display: flex; align-items: center; gap: 12px; }
.counter { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counter.full { color: var(--error); }
.keys { font-size: 12px; color: var(--muted); margin-left: auto; }
.form-note { margin: 0; font-size: 12.5px; overflow-wrap: anywhere; }
.form-note:empty { display: none; }
.form-note.ok { color: var(--working); }
.form-note.red { color: var(--error); }

/* History */
.history { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.history .day { padding: 8px 16px; font-size: 11.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); border-top: 1px solid var(--line); }
.history .day:first-child { border-top: 0; }
.entry { display: grid; grid-template-columns: 52px 20px minmax(0, 1fr); align-items: start; gap: 8px; padding: 9px 16px; font-size: 13.5px; line-height: 1.45; border-top: 1px solid var(--line); }
.entry time { font: 12px var(--mono); color: var(--muted); padding-top: 1px; font-variant-numeric: tabular-nums; }
.entry .mini-avatar { margin-top: 1px; }
.what { color: var(--text-2); overflow-wrap: anywhere; }
.what b { color: var(--text); font-weight: 650; }
.what .code { color: var(--text); }
.e-warning .what { color: var(--error); }
.e-approval .what, .e-error .what { color: var(--approval); }
.e-mail .what { color: var(--text); }

/* Settings */
.set-section { margin-bottom: 30px; }
.set-desc { margin: -4px 0 10px; color: var(--muted); font-size: 13px; }
.set-list { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 14px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.set-row:first-child { border-top: 0; }
.set-text { min-width: 0; flex: 1 1 260px; }
.set-label { font-weight: 600; font-size: 14px; }
.set-hint { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere; }
.set-control { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.set-value { font: 13px var(--mono); color: var(--text-2); overflow-wrap: anywhere; text-align: right; }
.swatches { display: flex; gap: 8px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--line-strong); padding: 0; background: var(--sw); }
.swatch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--text); }
.cmd { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cmd code { padding: 5px 9px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; }

/* Toasts */
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: flex; flex-direction: column; gap: 8px; width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--surface); border-radius: 10px; padding: 11px 14px; box-shadow: var(--pop); font-size: 13px; animation: slide-in .2s ease-out; display: flex; gap: 10px; }
.toast > svg { width: 17px; height: 17px; margin-top: 1px; color: var(--accent); }
.toast.approval > svg { color: var(--approval); }
.toast.warning > svg, .toast.red > svg { color: var(--error); }
.toast strong { display: block; font-size: 13px; }
.toast div div { color: var(--text-2); overflow-wrap: anywhere; }
@keyframes slide-in { from { transform: translateY(6px); opacity: 0; } }

/* Sidebar tint, avatars, card list, message list, toast position */
.sidebar { background: linear-gradient(color-mix(in srgb, var(--tint) var(--tint-o), transparent), color-mix(in srgb, var(--tint) var(--tint-o), transparent)), var(--bg); }
:root[data-avatars="mono"] .avatar, :root[data-avatars="mono"] .mini-avatar { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
:root[data-cards="list"] .cards { grid-template-columns: minmax(0, 1fr); }
:root[data-cards="list"] .session { display: grid; grid-template-columns: minmax(150px, auto) minmax(0, 1fr); gap: 6px 18px; align-items: start; }
:root[data-cards="list"] .session > .card-top { grid-row: span 6; flex-direction: column; align-items: flex-start; }
:root[data-cards="list"] .session > * { grid-column: 2; }
:root[data-cards="list"] .session > .card-top { grid-column: 1; }
:root[data-bubbles="list"] .msg, :root[data-bubbles="list"] .msg.mine { align-self: stretch; max-width: none; }
:root[data-toast="tr"] .toasts { bottom: auto; top: 20px; }
:root[data-toast="bl"] .toasts { right: auto; left: 20px; }
:root[data-toast="tl"] .toasts { right: auto; left: 20px; bottom: auto; top: 20px; }
.toast-x { margin-left: auto; align-self: flex-start; background: none; border: 0; padding: 2px; border-radius: 5px; color: var(--muted); display: grid; }
.toast-x:hover { background: var(--hover); color: var(--text); }
.toast-x svg { width: 14px; height: 14px; }
.group-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); flex: none; }
.group-icon svg { width: 17px; height: 17px; }
.group-icon.state .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--state, var(--muted)); }
.person.s-working { --state: var(--working); } .person.s-approval { --state: var(--approval); } .person.s-waiting { --state: var(--waiting); }
.person.s-quiet { --state: var(--quiet); } .person.s-error { --state: var(--error); }

/* Sidebar search button */
.side-search {
  display: flex; align-items: center; gap: 10px; margin: 0 0 12px; padding: 7px 10px; border-radius: 8px; width: 100%;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; text-align: left;
}
.side-search:hover { border-color: var(--line-strong); color: var(--text-2); }
.side-search svg { width: 15px; height: 15px; }
.side-search .kbd { margin-left: auto; }
.kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line-strong); border-bottom-width: 2px; background: var(--surface-2); font: 600 11.5px var(--sans); color: var(--text-2); }
.keys-row { gap: 4px; }

/* Settings: pages on the left, one page on the right */
.set-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; align-items: start; }
.set-nav { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 10px; }
.set-search { display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.set-search:focus-within { border-color: var(--accent); }
.set-search svg { width: 15px; height: 15px; color: var(--muted); }
.set-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 13.5px; }
.set-cats { display: flex; flex-direction: column; gap: 1px; }
.set-cat {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; border: 0; background: none;
  color: var(--text-2); font-size: 13.5px; font-weight: 500; text-align: left; transition: background-color .15s;
}
.set-cat svg { width: 16px; height: 16px; color: var(--muted); }
.set-cat:hover { background: var(--hover); color: var(--text); }
.set-cat[aria-current="page"] { background: var(--surface-2); color: var(--text); font-weight: 650; }
.set-cat[aria-current="page"] svg { color: var(--accent); }
.set-count { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.set-title { margin: 0 0 18px; font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.set-row.flash { animation: flash 1.8s ease-out; }
.set-control select { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); max-width: 240px; }
.range { display: flex; align-items: center; gap: 10px; }
.range input { width: 160px; accent-color: var(--accent); }
.range-value { min-width: 46px; text-align: right; font: 12.5px var(--mono); color: var(--text-2); font-variant-numeric: tabular-nums; }
input.color { width: 32px; height: 32px; padding: 0; border: 1px solid var(--line-strong); border-radius: 8px; background: none; cursor: pointer; }
.swatch.custom { position: relative; overflow: hidden; display: inline-block; cursor: pointer;
  background: conic-gradient(from 0deg, #ef4444, #f59e0b, #22c55e, #06b6d4, #6366f1, #d946ef, #ef4444); }
.swatch.custom.on { background: var(--sw); box-shadow: 0 0 0 2px var(--text); }
.swatch.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.dev { margin: 0; max-height: 420px; overflow: auto; padding: 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); font: 11.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.about-lead { margin: 0 0 14px; color: var(--text-2); max-width: 60ch; }

/* Command palette */
.palette { position: fixed; inset: 0; z-index: 60; display: grid; justify-items: center; align-items: start; padding: 12vh 16px 16px; background: light-dark(rgb(0 0 0 / .25), rgb(0 0 0 / .6)); }
.palette-box { width: min(620px, 100%); border-radius: 14px; background: var(--surface); box-shadow: var(--pop); overflow: hidden; animation: slide-in .15s ease-out; }
.palette-head { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.palette-head svg { width: 18px; height: 18px; color: var(--muted); }
.palette-head input { flex: 1; min-width: 0; height: 52px; border: 0; outline: 0; background: none; font-size: 15.5px; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: min(420px, 60vh); overflow: auto; }
.palette li { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.palette li svg { width: 16px; height: 16px; color: var(--muted); }
.palette li[aria-selected="true"] { background: var(--hover); }
.palette li[aria-selected="true"] svg { color: var(--accent); }
.pal-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette li .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
.palette .pal-empty { color: var(--muted); cursor: default; justify-content: center; }

/* Wall display: only the overview, bigger, no navigation */
:root[data-wall="on"] .app { grid-template-columns: minmax(0, 1fr); }
:root[data-wall="on"] .sidebar, :root[data-wall="on"] .topbar, :root[data-wall="on"] .tabbar { display: none; }
:root[data-wall="on"] .view { max-width: none; }
:root[data-wall="on"] .main { padding: 28px 36px; }
.wall-exit { position: fixed; top: 14px; right: 14px; z-index: 30; opacity: .35; transition: opacity .15s; }
.wall-exit:hover, .wall-exit:focus-visible { opacity: 1; }

@media (max-width: 860px) {
  .set-layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .set-nav { position: static; }
  .set-cats { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; scrollbar-width: none; }
  .set-cat { white-space: nowrap; flex: none; background: var(--surface-2); }
  .set-count { display: none; }
  .range input { width: 120px; }
  .set-control, .set-control .seg { max-width: 100%; }
  .set-control .seg { flex-wrap: wrap; }
  .set-cat[aria-current="page"] { box-shadow: 0 0 0 1px var(--line-strong); }
  :root[data-cards="list"] .session { display: block; }
  :root[data-toast] .toasts { left: 16px; right: 16px; width: auto; }
  :root[data-toast="br"] .toasts, :root[data-toast="bl"] .toasts { top: auto; bottom: calc(80px + env(safe-area-inset-bottom)); }
}

/* Small screens: top bar and a tab bar at the bottom instead of the sidebar */
@media (max-width: 1080px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .live { margin-left: auto; }
  .tabbar {
    position: fixed; inset: auto 0 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  }
  .tabbar a { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 4px; min-height: 48px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 600; border-radius: 8px; }
  .tabbar a svg { width: 21px; height: 21px; }
  .tabbar a[aria-current="page"] { color: var(--text); }
  .tabbar a[aria-current="page"] svg { color: var(--accent); }
  .tabbar .count { position: absolute; top: 2px; left: calc(50% + 6px); margin: 0; min-width: 17px; height: 17px; font-size: 10.5px; }
  .main { padding: 18px 16px calc(84px + env(safe-area-inset-bottom)); }
  .page-head h1 { font-size: 21px; }
  .view.fill { height: calc(var(--vh) - 56px - 18px - 84px - env(safe-area-inset-bottom)); }
  .msg { max-width: 94%; }
  .entry { grid-template-columns: 44px 18px minmax(0, 1fr); padding: 9px 12px; }
  .toasts { right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); }
}
@media (prefers-reduced-motion: reduce) {
  :root:not([data-motion="full"]) *, :root:not([data-motion="full"]) *::before, :root:not([data-motion="full"]) *::after { animation: none !important; transition: none !important; }
}
:root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before, :root[data-motion="reduce"] *::after { animation: none !important; transition: none !important; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2" opacity=".25"/>
        <circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2" opacity=".6"/>
        <path d="M16 3a13 13 0 0 1 13 13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <circle class="core" cx="16" cy="16" r="3.2"/>
      </svg>
      <span class="wordmark">Synchronauts</span>
    </div>
    <div class="room" id="room"></div>
    <button class="side-search" type="button" data-palette><span data-icon="SEARCH"></span><span data-l='["Search","Suchen"]'></span><kbd class="kbd">⌘K</kbd></button>
    <nav class="nav" data-t-label="nav.label">
      <a href="#/overview" data-view="overview"><span data-icon="GRID"></span><span data-t="nav.overview"></span><span class="count warn" data-count="overview"></span></a>
      <a href="#/messages" data-view="messages"><span data-icon="CHAT"></span><span data-t="nav.messages"></span><span class="count" data-count="messages"></span></a>
      <a href="#/history" data-view="history"><span data-icon="CLOCK"></span><span data-t="nav.history"></span></a>
      <a href="#/settings" data-view="settings"><span data-icon="GEAR"></span><span data-t="nav.settings"></span></a>
    </nav>
    <div class="side-foot">
      <div class="side-row"><span class="lbl"><span data-icon="MOON"></span><span id="dark-label" data-t="theme.toggle"></span></span>
        <button class="switch" type="button" role="switch" aria-labelledby="dark-label" data-dark><span class="knob"></span></button></div>
      <div class="side-row"><span class="live" data-live><span class="dot"></span><span data-live-text></span></span></div>
      <button class="side-user" id="me" type="button" hidden></button>
    </div>
  </aside>

  <header class="topbar">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2" opacity=".25"/>
      <circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2" opacity=".6"/>
      <path d="M16 3a13 13 0 0 1 13 13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <circle class="core" cx="16" cy="16" r="3.2"/>
    </svg>
    <span class="wordmark">Synchronauts</span>
    <span class="live" data-live><span class="dot"></span><span data-live-text></span></span>
    <button class="icon-btn" type="button" data-palette data-l-label='["Search","Suchen"]'><span data-icon="SEARCH"></span></button>
    <button class="icon-btn" type="button" data-dark-btn><span data-icon="MOON"></span></button>
  </header>

  <main class="main">
    <div class="banner red" id="conn" hidden></div>

    <section class="view" id="view-overview" aria-labelledby="h-overview">
      <header class="page-head"><div><h1 id="h-overview" data-t="nav.overview"></h1><p id="sub-overview"></p></div></header>
      <div id="overview"><div class="empty-state" data-t="board.loading"></div></div>
    </section>

    <section class="view fill" id="view-messages" aria-labelledby="h-messages" hidden>
      <header class="page-head">
        <div><h1 id="h-messages" data-t="nav.messages"></h1><p data-t="page.messages.sub"></p></div>
        <div class="toolbar">
          <div class="seg" role="group" data-t-label="mail.filter">
            <button type="button" data-filter="mine" aria-pressed="true" data-t="mail.mine"></button>
            <button type="button" data-filter="all" aria-pressed="false" data-t="mail.all"></button>

      </header>
      <div class="stream" id="mail" aria-live="polite"></div>
      <form class="composer" id="compose" autocomplete="off">
        <div class="composer-top">
          <label><span data-t="form.to"></span><select id="to"></select></label>
          <label><span data-t="form.session"></span><select id="where"></select></label>
        </div>
        <textarea id="text" rows="1" data-t-label="form.message"></textarea>

          <select id="hist-person" data-t-label="filter.person"></select>
          <select id="hist-kind" data-t-label="filter.kind"></select>

      </header>
      <ol class="history" id="history"></ol>
    </section>

    <section class="view" id="view-settings" aria-labelledby="h-settings" hidden>
      <header class="page-head"><div><h1 id="h-settings" data-t="nav.settings"></h1><p data-t="page.settings.sub"></p></div></header>
      <div id="settings"></div>

  <nav class="tabbar" data-t-label="nav.label">
    <a href="#/overview" data-view="overview"><span data-icon="GRID"></span><span data-t="nav.overview"></span><span class="count warn" data-count="overview"></span></a>
    <a href="#/messages" data-view="messages"><span data-icon="CHAT"></span><span data-t="nav.messages"></span><span class="count" data-count="messages"></span></a>
    <a href="#/history" data-view="history"><span data-icon="CLOCK"></span><span data-t="nav.history"></span></a>
    <a href="#/settings" data-view="settings"><span data-icon="GEAR"></span><span data-t="nav.settings"></span></a>
  </nav>
</div>

function store(key, value) {  // every access in try/catch: private windows and blocked site data throw
  try {
    if (value === undefined) return localStorage.getItem(key);
    if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value);
  } catch (_) { /* then the choice only lasts for this visit */ }
  return null;
}

async function load() {
  if (busy) return;
  busy = true;
  clearTimeout(timer);
  try {
    const headers = { 'X-SYN-Token': TOKEN };
    if (etag) headers['If-None-Match'] = etag;
    const r = await fetch('/api/state', { headers, cache: 'no-store' });
    if (r.status === 403) return connection('restarted');
    if (r.status !== 200 && r.status !== 304) throw new Error(`HTTP ${r.status}`);
    fetchedAt = r.headers.get('X-SYN-Fetched') || fetchedAt;
    if (r.status === 200) {
      etag = r.headers.get('ETag') || '';
      data = await r.json();
      try { notify(); render(); } catch (e) { console.error(e); }
    }
    connection('ok');
  } catch (_) {
    connection('down');
  } finally {
    busy = false;
    liveRender();
    const hidden = +settings.pollHidden;
    timer = setTimeout(load, document.hidden ? (hidden ? hidden * 1000 : 6e5) : +settings.poll * 1000);
  }
}

function notify() {
  const d = data, me = d.me;
  for (const n of d.mail) {
    if (seen.mail.has(n.id)) continue;
    seen.mail.add(n.id);
    if (first || n.from === me || !list(n.to).includes(me)) continue;
    freshMail.add(n.id);
    if (!(view === 'messages' && !document.hidden)) unseenMail.add(n.id);
    if (n.trust === 'bad') {
      if (settings.nForged) toast(L(['Forged message', 'Gefälschte Nachricht']), t('attn.forged', name(n.from)), 'red');
    } else if (list(n.to).length > 1 ? settings.nFyi : settings.nMail) {
      toast(t('toast.mail', name(n.from)), shorten(n.text, 160), 'mail');
    }
  }
  for (const s of d.sessions) {
    const before = seen.state.get(s.key);
    seen.state.set(s.key, s.state);
    if (first || before === s.state) continue;
    const mine = s.login === me;
    if (s.state === 'approval' && (mine ? settings.nApproval : settings.nTeamApproval)) {
      toast(t('toast.approval'), mine ? t('toast.approvalBody', where(s)).replace(/ {2,}/g, ' ')
        : L([`${name(s.login)} is waiting for an approval ${where(s)}`, `${name(s.login)} wartet auf eine Freigabe ${where(s)}`]), 'approval');
    }
    if (s.state === 'error' && settings.nError) toast(t('state.error'), t('attn.error', `${mine ? t('mail.you') : name(s.login)} ${where(s)}`), 'red');
  }
  for (const o of serious(d)) {
    const key = [o.a, o.b, o.repo, o.kind, list(o.files).join(',')].join('|');
    if (seen.overlap.has(key)) continue;
    seen.overlap.add(key);
    const mine = [o.a, o.b].find((x) => loginOf(x) === me);
    if (first || !mine || !(o.kind === 'conflict' ? settings.nConflict : settings.nOverlap)) continue;
    const other = cap(who(mine === o.a ? o.b : o.a, me));
    toast(t('toast.overlap'), o.kind === 'conflict' ? t('toast.conflict', other, short(o.repo), list(o.files).join(', '))
      : o.kind === 'file' ? t('toast.overlapFile', other, short(o.repo), list(o.files).join(', '))

// Pages live in the address (#/messages, #/settings/notifications): the back button works and a link opens a page.

function show(path) {
  const [v, sub] = String(path || '').split('/');
  view = VIEWS.includes(v) ? v : settings.startPage;
  if (settings.wall) view = 'overview';
  if (view === 'settings' && CATS.some((c) => c[0] === sub)) setCat = sub;
  for (const v2 of VIEWS) $(`#view-${v2}`).hidden = v2 !== view;
  for (const a of $$('[data-view]')) {
    if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  if (view === 'messages') unseenMail.clear();
  if (view === 'settings') settingsRender();
  render();
  if (view === 'messages') { const box = $('#mail'); box.scrollTop = box.scrollHeight; }
}
function go(path) {
  if (location.hash !== `#/${path}`) history.pushState(null, '', `#/${path}`);
  if (path.split('/')[0] !== view) window.scrollTo(0, 0);
  show(path);
}
window.addEventListener('hashchange', () => { show(location.hash.replace(/^#\/?/, '')); window.scrollTo(0, 0); });

function jump(key) {
  go('overview');
  const el = $$('.session[data-key]').find((x) => x.dataset.key === key);
  if (!el) return;
  el.scrollIntoView({ block: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
  el.classList.remove('flash');
  void el.offsetWidth;  // restart the animation
  el.classList.add('flash');
}
const reducedMotion = () => settings.motion === 'reduce' || (settings.motion === 'system' && matchMedia('(prefers-reduced-motion: reduce)').matches);

// --- Drawing ------------------------------------------------------------------

function render() {
  if (!data) return;
  shellRender();
  if (view === 'overview') overviewRender();
  if (view === 'messages') { recipients(); mailRender(); count(); }
  if (view === 'history') historyRender();
  if (view === 'settings') { if (!settingsData) settingsRender(); else { connRender(); devRender(); } }
  setTitle();
}

let meKey = '';
function meRender() {  // bottom left: who this board belongs to, the GitHub account and this machine
  const d = data, el = $('#me');
  if (!d.me) { el.hidden = true; return; }
  const p = person(d.me), key = JSON.stringify([lang, d.me, p.name, d.machine]);
  if (key === meKey) return;
  meKey = key;
  const label = L(['Your account, this machine', 'Dein Konto, dieser Rechner']);
  fill(el, h('span', { class: 'avatar', style: { '--hue': hue(d.me) }, 'aria-hidden': 'true' }, initials(p.name || d.me)),
    h('span', { class: 'side-user-text' }, h('span', { class: 'side-user-name' }, p.name || d.me), h('span', { class: 'side-user-sub' }, `@${d.me} · ${d.machine}`)));
  el.title = `${label}: @${d.me} · ${d.machine}`;
  el.setAttribute('aria-label', `${p.name || d.me}, @${d.me} · ${d.machine}`);
  el.hidden = false;
}
$('#me').addEventListener('click', () => go('settings/connection'));

function shellRender() {
  const d = data;
  $('#room').textContent = d.room || t('room.solo');
  $('#room').title = d.room ? t('room.tip') : t('room.solo.tip');
  meRender();
  const attention = attentionRows().length;
  for (const el of $$('[data-count="overview"]')) el.textContent = attention ? String(attention) : '';
  for (const el of $$('[data-count="messages"]')) el.textContent = unseenMail.size ? String(unseenMail.size) : '';
}

function liveRender() {
  const at = toDate(fetchedAt), age = at ? (Date.now() - at) / 1000 : null;
  let text = t('live.ok'), kind = '';
  if (connected === false) { text = t('live.off'); kind = 'off'; }
  else if (connected === null) text = t('live.connecting');
  else if (data && data.error) { text = t('live.degraded'); kind = 'degraded'; }
  else if (age == null) text = t('live.waiting');
  else if (age > 60) { text = t('live.synced', ago(fetchedAt)); kind = 'degraded'; }
  else if (age > 15) text = t('live.synced', t('ago.sec', Math.round(age)));
  for (const el of $$('[data-live]')) {
    el.className = `live ${kind}`;
    el.title = data && data.error ? data.error : t('live.tip');
    el.querySelector('[data-live-text]').textContent = text;
  }
}

// Overview

function attentionRows() {
  const d = data, me = d.me, rows = [];
  for (const s of d.sessions.filter((x) => x.login === me && x.state === 'approval')) {
    rows.push({ kind: 'warn', text: t('attn.approval', where(s)), action: t('attn.show'), run: () => jump(s.key) });
  }
  for (const s of d.sessions.filter((x) => x.state === 'error')) {
    rows.push({ kind: 'red', text: t('attn.error', `${s.login === me ? t('mail.you') : name(s.login)} ${where(s)}`), action: t('attn.show'), run: () => jump(s.key) });
  }
  for (const o of serious(d).filter((x) => x.kind !== 'branch')) {
    const mine = [o.a, o.b].find((x) => loginOf(x) === me);
    if (!mine) continue;
    const other = who(mine === o.a ? o.b : o.a, me);
    rows.push({ kind: 'red', text: tx(o.kind === 'conflict' ? 'attn.conflict' : 'attn.file', short(o.repo), other, h('code', {}, list(o.files).join(', '))),
      action: t('attn.show'), run: () => jump(mine) });
  }
  for (const n of d.mail.filter((x) => x.trust === 'bad' && x.from !== me && list(x.to).includes(me))) {
    rows.push({ kind: 'red', text: t('attn.forged', name(n.from)), action: t('attn.open'), run: () => go('messages') });
  }
  return rows;
}

function sortSessions(arr) {
  const me = data.me, recent = (a, b) => String(b.last).localeCompare(String(a.last));
  const by = {
    state: (a, b) => (RANK[a.state] ?? 9) - (RANK[b.state] ?? 9) || recent(a, b),
    recent,
    repo: (a, b) => short(mainRepo(a) || '~').localeCompare(short(mainRepo(b) || '~')) || recent(a, b),
  }[settings.sortBy] || recent;
  return arr.sort((a, b) => (settings.mineFirst ? (b.login === me) - (a.login === me) : 0) || by(a, b));
}

function groupHead(lead, title, info, extra) {
  return h('div', { class: 'person-head' }, lead, h('div', {}, h('div', { class: 'person-name' }, title, extra), info ? h('div', { class: 'person-info' }, info) : null));
}

function overviewRender() {
  const d = data, kids = [];
  $('#sub-overview').textContent = d.room ? t('page.overview.sub') : t('page.overview.solo');
  if (d.error) kids.push(h('div', { class: 'banner yellow' }, h('strong', {}, t('board.degraded')), t('board.degradedBody', d.error)));

  if (settings.showKpis) {
    const active = d.sessions.filter((s) => hasRepos(s) && s.state !== 'quiet').length;
    const approvals = d.sessions.filter((s) => s.state === 'approval');
    const warn = serious(d);
    const kpi = (value, label, kind, target) => h(target ? 'button' : 'div', {
      class: `kpi ${kind}`, type: target ? 'button' : null, title: target ? t('attn.show') : null, onclick: target ? () => jump(target) : null,
    }, h('span', { class: 'kpi-label' }, kind ? h('span', { class: 'dot', 'aria-hidden': 'true' }) : null, label), h('span', { class: 'kpi-value' }, String(value)));
    kids.push(h('div', { class: 'kpis' },
      kpi(active, t('kpi.active'), ''),
      kpi(d.people.length, t('kpi.people'), ''),
      kpi(approvals.length, t('kpi.approval'), approvals.length ? 'warn' : '', approvals[0] && approvals[0].key),
      kpi(warn.length, t('kpi.overlaps'), warn.length ? 'red' : '', warn[0] && warn[0].a)));
  }
  const rows = settings.showAttention ? attentionRows() : [];
  if (rows.length) {
    kids.push(h('section', { class: 'block' }, h('h2', { class: 'block-title' }, t('attn.title')),
      h('div', { class: 'attn' }, rows.map((r) => h('div', { class: `attn-row k-${r.kind}` }, icon('ALERT'),
        h('span', { class: 'attn-text' }, r.text), h('button', { class: 'link', type: 'button', onclick: r.run }, r.action))))));
  }
  const ms = list(d.missions);
  if (settings.showMissions && ms.length) kids.push(h('section', { class: 'block' }, h('h2', { class: 'block-title' }, t('missions.title')), ms.map(missionCard)));

  const visible = d.sessions.filter((s) => (settings.showQuiet || s.state !== 'quiet') && (settings.showCodex || s.agent !== 'codex')
    && (settings.showLocal || hasRepos(s)));
  const draw = (s) => (hasRepos(s) ? card(s) : localCard(s));
  const grid = (arr) => h('div', { class: 'cards' }, sortSessions(arr).map(draw));
  const groups = [];
  if (settings.groupBy === 'person') {
    for (const p of d.people) {
      const mine = visible.filter((s) => s.login === p.login), me = p.login === d.me;
      if (!mine.length && settings.hideEmpty) continue;
      const team = mine.filter(hasRepos).length;
      const info = [team ? t('board.sessions', team) : t('board.noSession'), list(p.machines).join(', ')].filter(Boolean).join(' · ');
      groups.push(h('section', { class: 'person' },
        groupHead(h('span', { class: 'avatar', style: { '--hue': hue(p.login) }, 'aria-hidden': 'true' }, initials(p.name)), p.name, info,
          me ? h('span', { class: 'you' }, t('board.you')) : null),
        mine.length ? grid(mine) : h('div', { class: 'empty-state small' }, me ? t('board.emptyMine') : t('board.emptyOther', p.name))));
    }
  } else if (settings.groupBy === 'repo') {
    const repos = [...new Set(visible.flatMap((s) => Object.keys(s.repos || {})))].sort((a, b) => short(a).localeCompare(short(b)));
    for (const repo of repos) {
      const here = visible.filter((s) => s.repos && s.repos[repo]);
      const people = [...new Set(here.map((s) => name(s.login)))].join(', ');
      groups.push(h('section', { class: 'person' }, groupHead(h('span', { class: 'group-icon' }, icon('FOLDER')), short(repo),
        `${t('board.sessions', here.length)} · ${people}`), grid(here)));
    }
    const local = visible.filter((s) => !hasRepos(s));
    if (local.length) groups.push(h('section', { class: 'person' }, groupHead(h('span', { class: 'group-icon' }, icon('LAPTOP')), cap(t('card.outside'))), grid(local)));
  } else if (settings.groupBy === 'state') {
    for (const st of [...STATES].sort((a, b) => RANK[a] - RANK[b])) {
      const here = visible.filter((s) => s.state === st);
      if (!here.length) continue;
      groups.push(h('section', { class: `person s-${st}` }, groupHead(h('span', { class: 'group-icon state' }, h('span', { class: 'dot' })), cap(t(`state.${st}`)),
        String(here.length)), grid(here)));
    }
  } else {
    groups.push(visible.length ? grid(visible) : h('div', { class: 'empty-state small' }, t('board.noSession')));
  }
  kids.push(h('section', { class: 'block' }, h('h2', { class: 'block-title' }, t('board.title')), groups));
  if (!d.room) {
    kids.push(h('div', { class: 'empty-state' }, tx('board.solo', h('code', {}, `${CMD} setup <owner/repo>`))));
  } else if (d.people.length === 1) {
    kids.push(h('div', { class: 'empty-state' }, tx('board.alone', h('code', {}, d.room), h('code', {}, `${CMD} setup ${d.room}`))));
  }
  fill($('#overview'), kids);
}

function missionCard(m) {
  const joined = new Set(list(m.joined).map((k) => k.split('/')[0]));
  const crew = list(m.with).map((l) => h('span', {
    class: `crew-member${joined.has(l) ? '' : ' invited'}`, title: joined.has(l) ? t('mission.joined') : t('mission.invitedTip'),
  }, mini(l), name(l) + (joined.has(l) ? '' : ` · ${t('mission.invited')}`)));
  const start = toDate(m.start), until = toDate(m.until);
  let time;
  if (m.ended) time = t('mission.ended', hhmm(m.ended.time), name(m.ended.by));
  else if (m.live && until) time = [h('b', {}, t('mission.left', dur(until - Date.now()))), ` · ${t('mission.until', hhmm(m.until))}`];
  else time = t('mission.over');
  const share = m.live && start && until && until > start ? Math.min(100, Math.max(2, ((Date.now() - start) / (until - start)) * 100)) : 0;
  return h('article', { class: `mission${m.live ? '' : ' over'}` },
    h('div', { class: 'mission-head' },
      h('span', { class: 'mission-tag' }, icon('ROCKET'), t('mission.title')),
      h('div', { class: 'crew' }, crew),
      h('span', { class: 'mission-time' }, time),
      m.live ? h('button', { class: 'btn small danger', type: 'button', onclick: () => stopMission(m) }, t('mission.stop')) : null),
    h('p', { class: 'plan' }, m.plan),
    m.ended && m.ended.summary ? h('p', { class: 'result' }, t('mission.result', m.ended.summary)) : null,
    m.live ? h('div', { class: 'mission-bar', role: 'progressbar', 'aria-label': t('mission.elapsed'), 'aria-valuemin': '0',
      'aria-valuemax': '100', 'aria-valuenow': String(Math.round(share)) }, h('span', { style: { width: `${share}%` } })) : null);
}

async function stopMission(m) {
  if (settings.confirmStop && !confirm(t('mission.stopConfirm'))) return;
  try {
    const r = await fetch('/api/end', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-SYN-Token': TOKEN }, body: JSON.stringify({ id: m.id }),
    });
    const a = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(a.error || t('form.error', r.status));
    load();
  } catch (f) {
    toast(t('mission.title'), f.message, 'red');
  }
}

function statePill(s) {
  const known = STATES.includes(s.state);
  const tip = known ? t(`state.${s.state}.tip`) : '';
  return h('span', { class: 'state', title: tip + (s.wakeable ? ` · ${t('card.wakeable.tip', data.wake_min)}` : '') },
    h('span', { class: 'dot', 'aria-hidden': 'true' }), known ? t(`state.${s.state}`) : String(s.state),
    h('span', { class: 'since' }, s.state === 'quiet' ? when(s.last) : t('card.since', hhmm(s.since))));
}

function card(s) {
  const d = data;
  const conflicts = new Set(d.overlaps.filter((o) => o.kind === 'conflict').map(pairKey));
  const hits = d.overlaps.filter((o) => (o.a === s.key || o.b === s.key) && !(o.kind === 'file' && !o.mission && conflicts.has(pairKey(o))))
    .sort((a, b) => (!!a.mission - !!b.mission) || (OVERLAP_RANK[a.kind] ?? 9) - (OVERLAP_RANK[b.kind] ?? 9));
  const hot = new Set(hits.filter((o) => !o.mission).flatMap((o) => list(o.files).map((f) => `${o.repo}|${f}`)));
  const repos = Object.entries(s.repos).sort((a, b) => String(b[1].last || '').localeCompare(String(a[1].last || '')));
  const files = repos.flatMap(([repo, r]) => list(r.files).slice().reverse().map((f) => [repo, String(f)]));
  const shown = files.slice(0, settings.filesPerCard);
  const claims = repos.flatMap(([repo, r]) => list(r.claims).map((c) => [repo, String(c)]));
  const codex = s.agent === 'codex';
  return h('article', { class: `session s-${cls(s.state)}`, 'data-key': s.key },
    h('div', { class: 'card-top' }, statePill(s),
      codex ? h('span', { class: 'tag codex', title: t('card.agent.codex.tip') }, 'Codex') : null),  // Claude is the default
    repos.map(([repo, r]) => h('div', { class: 'repo', title: repo },
      icon('FOLDER'), h('span', { class: 'name' }, short(repo)),
      settings.showBranch ? h('span', { class: 'branch', title: r.branch || '' }, r.branch || '–') : null)),
    s.task ? h('p', { class: 'task' }, t('q', s.task))
      : h('p', { class: 'task empty', title: t('card.noTask.tip', `${CMD} task "…"`) }, t('card.noTask')),
    shown.length ? h('div', { class: 'files' },
      shown.map(([repo, f]) => h('span', { class: `file${hot.has(`${repo}|${f}`) ? ' hot' : ''}`, title: `${short(repo)}/${f}` },
        f.length > 34 ? `…/${f.split('/').pop()}` : f)),
      files.length > shown.length ? h('span', { class: 'file more' }, `+${files.length - shown.length}`) : null) : null,
    claims.length ? h('div', { class: 'files' }, claims.map(([repo, c]) => h('span', { class: 'file claim', title: t('card.claim.tip', `${short(repo)}/${c}`) },
      icon('LOCK'), c.length > 34 ? `…/${c.replace(/\/$/, '').split('/').pop()}${c.endsWith('/') ? '/' : ''}` : c))) : null,
    settings.showOverlaps && hits.length ? h('div', { class: 'ovs' }, hits.map((o) => overlapRow(o, s))) : null,
    h('div', { class: 'card-foot' },
      h('span', { class: 'foot-meta', title: s.here ? (s.cwd || t('card.machine', d.machine)) : t('card.machine', s.machine) },
        icon('LAPTOP'), `${s.here ? t('card.thisMachine') : s.machine} · ${when(s.last)}`,
        s.wakeable ? h('span', { class: 'wakeable', title: t('card.wakeable.tip', d.wake_min) }, `· ${t('card.wakeable')}`) : null),
      s.login !== d.me ? h('button', { class: 'link', type: 'button', onclick: () => composeTo(s) }, t('card.message')) : null));
}

function overlapRow(o, s) {
  const otherKey = o.a === s.key ? o.b : o.a, other = who(otherKey, s.login);
  const files = h('b', {}, list(o.files).join(', '));
  if (o.mission) {
    return h('div', { class: 'ov ov-repo' }, icon('ROCKET'),
      h('span', {}, tx('ov.mission', other, h('b', {}, list(o.files).length ? list(o.files).join(', ') : short(o.repo)))));
  }
  if (o.kind === 'conflict') return h('div', { class: 'ov ov-conflict' }, icon('ALERT'), h('span', {}, tx('ov.conflict', other, files)));
  if (o.kind === 'file') return h('div', { class: 'ov ov-file' }, icon('ALERT'), h('span', {}, tx('ov.file', other, files)));
  if (o.kind === 'branch') return h('div', { class: 'ov ov-branch' }, icon('BRANCH'), h('span', {}, t('ov.branch', other, short(o.repo))));
  const there = sessionOf(otherKey), branch = there && there.repos[o.repo] ? there.repos[o.repo].branch : '';
  return h('div', { class: 'ov ov-repo' }, icon('INFO'),
    h('span', {}, branch ? t('ov.repoBranch', short(o.repo), other, branch) : t('ov.repo', short(o.repo), other)));
}

function localCard(s) {
  return h('article', { class: `session local s-${cls(s.state)}`, 'data-key': s.key },
    h('div', { class: 'card-top' }, statePill(s), h('span', { class: 'tag', title: t('card.localOnly.tip') }, t('card.localOnly'))),
    h('div', { class: 'cwd', title: t('card.outside') }, s.cwd || t('card.outside')),
    s.task ? h('p', { class: 'task' }, t('q', s.task)) : null,
    h('div', { class: 'card-foot' }, h('span', { class: 'foot-meta' }, icon('LAPTOP'), `${t('card.thisMachine')} · ${when(s.last)}`), h('span', {}, t('card.outside'))));
}

// Messages

function recipients() {
  const d = data, to = $('#to'), at = $('#where');
  const others = d.people.filter((p) => p.login !== d.me);
  const options = [...others.map((p) => p.login), ...(others.length > 1 ? ['all'] : [])];
  const chosen = options.includes(to.value) ? to.value : options.includes(settings.defaultTo) ? settings.defaultTo : options[0] || '';
  const targets = chosen === 'all' ? others.map((p) => p.login) : [chosen];
  const repos = [...new Set(d.sessions.filter((s) => targets.includes(s.login) && s.state !== 'quiet')
    .flatMap((s) => Object.keys(s.repos).map(short)))].sort();
  const key = JSON.stringify([lang, others.map((p) => [p.login, p.name]), chosen, repos]);
  if (key === optionsKey) return;
  optionsKey = key;
  const atBefore = at.value;
  fill(to, others.map((p) => h('option', { value: p.login }, p.name)), others.length > 1 ? h('option', { value: 'all' }, t('form.all')) : null);
  to.value = chosen;
  fill(at, h('option', { value: '' }, t('form.recent')), repos.map((r) => h('option', { value: r }, t('form.inRepo', r))));
  at.value = repos.includes(atBefore) ? atBefore : '';
  const empty = !others.length;
  for (const el of [to, at, $('#text'), $('#send')]) el.disabled = empty;
  $('#text').placeholder = empty ? t('form.none')
    : chosen === 'all' ? t('form.toAll') : t('form.toOne', name(chosen), poss(name(chosen)));
  const person = $('#mail-person'), before = mailPerson;
  fill(person, h('option', { value: '' }, t('filter.everyone')), others.map((p) => h('option', { value: p.login }, p.name)));
  person.value = others.some((p) => p.login === before) ? before : '';
}

function composeTo(s) {
  go('messages');
  $('#to').value = s.login;
  optionsKey = '';  // the sessions to pick from depend on the recipient
  recipients();
  const r = mainRepo(s);
  if (r && [...$('#where').options].some((o) => o.value === short(r))) $('#where').value = short(r);
  $('#text').focus();
}

function mailRender() {
  const d = data, box = $('#mail');
  const items = d.mail.filter((n) => (mailFilter === 'all' || n.from === d.me || list(n.to).includes(d.me))
    && (!mailPerson || n.from === mailPerson || list(n.to).includes(mailPerson))).slice(-150);
  const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const kids = [];
  let day = '';
  for (const n of items) {
    const label = dayLabel(n.time);
    if (settings.daySeps && label !== day) { day = label; kids.push(h('div', { class: 'day-sep' }, label)); }
    kids.push(msg(n));
  }
  fill(box, kids.length ? kids : h('div', { class: 'empty-state small' }, t(mailFilter === 'all' ? 'mail.emptyAll' : 'mail.emptyMine')));
  if (atEnd) box.scrollTop = box.scrollHeight;
}

function msg(n) {
  const mine = n.from === data.me, human = n.source === 'ui', toUi = n.repo === 'ui';
  const target = toUi ? t('mail.ui') : n.repo || '';
  const forged = !mine && n.trust === 'bad';
  return h('article', { class: `msg${mine ? ' mine' : ''}${forged ? ' forged' : ''}${freshMail.has(n.id) ? ' new' : ''}` },
    h('div', { class: 'msg-head' },
      mini(n.from),
      // Claude writes most messages: only a human author gets a badge, the author shows on hover over the name
      h('b', { title: human ? t('mail.human.tip') : n.from_repo ? t('mail.claude.from', n.from_repo) : t('mail.claude.tip') },
        mine ? t('mail.you') : name(n.from)), '→', h('b', {}, list(n.to).map((l) => name(l)).join(', ')),
      target ? h('span', { class: 'chip', title: toUi ? t('mail.ui.tip', `${CMD} send <name>@ui "…"`) : t('mail.session.tip') }, target) : null,
      human ? h('span', { class: 'chip human', title: t('mail.human.tip') }, t('mail.human')) : null,
      n.mission ? h('span', { class: 'chip', title: t('mail.mission.tip') }, t('mission.title')) : null,
      settings.showSeals && !forged && n.trust === 'ok'

$('#compose').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const text = $('#text').value.trim(), note = $('#form-note');
  if (!text || $('#send').disabled) return;
  const max = data ? data.max_text : 1500, to = $('#to').value, repo = $('#where').value;
  note.className = 'form-note';
  note.textContent = '';
  if ([...text].length > max) {
    note.className = 'form-note red';
    note.textContent = t('form.tooLong', [...text].length, max);
    return;
  }
  if (to === 'all' && settings.confirmAll && !confirm(L(['Send this to everyone in the room?', 'An alle im Raum senden?']))) return;
  $('#send').disabled = true;
  try {
    const r = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-SYN-Token': TOKEN },
      body: JSON.stringify({ to, repo, text }),
    });
    const a = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(a.error || t('form.error', r.status));
    $('#text').value = '';
    store('syn-draft', null);
    count();
    grow();
    // The server's `who` is English prose; build the same sentence in the active language instead.
    const names = to === 'all' ? data.people.filter((p) => p.login !== data.me).map((p) => p.name) : [name(to)];
    const recipient = names.join(', ') + (repo ? ` (${t('form.sessionIn', repo)})` : '');
    note.className = 'form-note ok';
    note.textContent = t('form.sent', names.length ? recipient : a.who)
      + (list(a.missing).length ? ` ${t('form.missing', a.missing.join(', '), repo)}` : '');
    setTimeout(() => { if (note.classList.contains('ok')) note.textContent = ''; }, 8000);
    load();
  } catch (f) {
    note.className = 'form-note red';
    note.textContent = f.message;
  } finally {
    $('#send').disabled = false;
  }
});

function count() {
  const n = [...$('#text').value].length, max = data ? data.max_text : 1500, el = $('#counter');
  el.textContent = `${n} / ${max}`;
  el.classList.toggle('full', n > max);
}
function grow() {  // the field grows with its text, up to its max-height
  const el = $('#text');
  el.style.setProperty('height', 'auto');
  el.style.setProperty('height', `${el.scrollHeight}px`);
}

function historyRender() {
  const d = data, kids = [];
  const people = [...d.people];
  const key = JSON.stringify([lang, people.map((p) => [p.login, p.name])]);
  if (key !== histKey) {  // only when they change: an open select stays open
    histKey = key;
    const sel = $('#hist-person');
    fill(sel, h('option', { value: '' }, t('filter.everyone')), people.map((p) => h('option', { value: p.login }, p.login === d.me ? `${p.name} (${t('board.you')})` : p.name)));
    sel.value = people.some((p) => p.login === histPerson) ? histPerson : '';
    const kind = $('#hist-kind');
    fill(kind, ['all', ...Object.keys(KINDS)].map((k) => h('option', { value: k }, t(`kind.${k}`))));
    kind.value = histKind;
  }
  const windowMs = +settings.histHours * 36e5;
  const entries = [...d.events, ...d.mail.map((n) => ({ time: n.time, kind: 'mail', login: n.from, n }))]
    .filter((x) => toDate(x.time) && Date.now() - toDate(x.time) < windowMs)
    .filter((x) => !histPerson || x.login === histPerson)
    .filter((x) => settings.histOwn || x.login !== d.me)
    .filter((x) => histKind === 'all' || (KINDS[histKind] || []).includes(x.kind))
    .sort((a, b) => toDate(b.time) - toDate(a.time)).slice(0, 300);
  let day = '';
  for (const x of entries) {
    const label = dayLabel(x.time);
    if (settings.histDays && label !== day) { day = label; kids.push(h('li', { class: 'day' }, label)); }
    kids.push(h('li', { class: `entry e-${cls(x.kind)}` },
      h('time', { datetime: x.time }, settings.histDays ? hhmm(x.time) : stamp(x.time)), mini(x.login), h('span', { class: 'what' }, historyText(x))));
  }
  fill($('#history'), kids.length ? kids : h('li', { class: 'empty-state small' }, t('history.empty')));
}

function historyText(x) {
  const w = h('b', {}, name(x.login)), r = short(x.repo), code = (c) => h('span', { class: 'code' }, c);
  const inRepo = r ? ` (${r})` : '';
  switch (x.kind) {
    case 'repo': return x.branch ? tx('ev.repoBranch', w, r, code(x.branch)) : tx('ev.repo', w, r);
    case 'branch': return tx('ev.branch', w, r, code(x.branch || ''));
    case 'file': return tx('ev.file', w, r, code(list(x.files).join(', ')));
    case 'task': return tx('ev.task', w, t('q', x.text || ''));
    case 'approval': return tx('ev.approval', w, inRepo);
    case 'error': return tx('ev.error', w, inRepo);
    case 'warning': {
      const owner = h('b', {}, poss(name(x.login))), other = whoDat(x.with, x.login);
      return x.files ? tx('ev.warnFile', w, owner, other, code(list(x.files).join(', ')), inRepo)
        : tx('ev.warnBranch', w, owner, other, code(x.branch || ''), inRepo);
    }
    case 'woken': return tx('ev.woken', h('b', {}, poss(name(x.login))),
      list(x.from).length ? t('ev.wokenFrom', list(x.from).map((l) => name(l)).join(', ')) : '');
    case 'end': return tx('ev.end', w, r);
    case 'claim': return tx('ev.claim', w, r, code(list(x.files).join(', ')));
    case 'release': return tx('ev.release', w, r, code(list(x.files).join(', ')));
    case 'mission': return tx(`ev.mission.${['start', 'join', 'end'].includes(x.step) ? x.step : 'start'}`, w, t('q', shorten(x.text, 100)));
    case 'mail': return [w, ' → ', h('b', {}, list(x.n.to).map((l) => name(l)).join(', ')),
      x.n.repo === 'ui' ? ` (${t('mail.ui')})` : x.n.repo ? ` (${x.n.repo})` : '', ': ', t('q', shorten(x.n.text, 100))];
    default: return [w, ` ${x.kind}`];
  }
}

function settingRow(e) {

    h('div', { class: 'set-control' }, control(e, id)));

function control(e, id) {
  const v = settings[e.k];
  if (e.type === 'switch') {
    return h('button', { type: 'button', class: 'switch', role: 'switch', 'aria-checked': String(!!v), 'aria-labelledby': id, 'data-ctl': e.k,
      onclick: () => (e.set ? e.set(!v) : save({ [e.k]: !v })) }, h('span', { class: 'knob' }));

  if (e.type === 'seg') {
    return h('div', { class: 'seg', role: 'radiogroup', 'aria-labelledby': id }, e.opts.map(([val, label], i) => h('button', {
      type: 'button', role: 'radio', 'aria-checked': String(v === val), 'data-ctl': `${e.k}:${i}`, onclick: () => save({ [e.k]: val }),
    }, L(label))));
  }
  if (e.type === 'select') {
    const opts = typeof e.opts === 'function' ? e.opts() : e.opts;
    const sel = h('select', { 'aria-labelledby': id, 'data-ctl': e.k, onchange: (ev) => save({ [e.k]: ev.target.value }) },
      opts.map(([val, label]) => h('option', { value: val }, L(label))));

  if (e.type === 'range') {
    const out = h('output', { class: 'range-value' }, `${v}${e.unit || ''}`);
    return h('div', { class: 'range' }, h('input', {
      type: 'range', min: String(e.min), max: String(e.max), step: String(e.step), value: String(v), 'aria-labelledby': id, 'data-ctl': e.k,

  if (settings.bell) return save({ bell: false });
  const answer = Notification.permission === 'default' ? await Notification.requestPermission() : Notification.permission;

  document.body.append(a);

function importSettings() {

  input.addEventListener('change', async () => {
    const f = input.files[0];

    try {
      settings = sanitize(JSON.parse(await f.text()));
      store('syn-settings', JSON.stringify(settings));
      applySettings();
      toast(L(['Settings imported', 'Einstellungen importiert']), f.name, 'info');

function palRender() {
  fill($('#palette-list'), palItems.length ? palItems.map((c, i) => h('li', {
    role: 'option', id: `pal-${i}`, 'aria-selected': String(i === palSel), onclick: () => runPal(i),
    onmouseenter: () => { palSel = i; for (const li of $$('#palette-list li')) li.setAttribute('aria-selected', String(li.id === `pal-${i}`)); },
  }, icon(c.icon), h('span', { class: 'pal-label' }, c.label), c.sub ? h('span', { class: 'sub' }, c.sub) : null))
    : h('li', { class: 'pal-empty' }, L(['Nothing found', 'Nichts gefunden'])));
  $('#palette-input').setAttribute('aria-activedescendant', palItems.length ? `pal-${palSel}` : '');
  const el = $(`#pal-${palSel}`);
  if (el) el.scrollIntoView({ block: 'nearest' });
}
function runPal(i) { const c = palItems[i]; closePalette(); if (c) c.run(); }
$('#palette-input').addEventListener('input', palFilter);
$('#palette-input').addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    palSel = Math.max(0, Math.min(palItems.length - 1, palSel + (ev.key === 'ArrowDown' ? 1 : -1)));
    palRender();
  } else if (ev.key === 'Enter') { ev.preventDefault(); runPal(palSel); }
});
$('#palette').addEventListener('click', (ev) => { if (ev.target.id === 'palette') closePalette(); });
for (const b of $$('[data-palette]')) b.addEventListener('click', openPalette);

// --- Keyboard ---------------------------------------------------------------------

let gUntil = 0;
document.addEventListener('keydown', (ev) => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); if ($('#palette').hidden) openPalette(); else closePalette(); return; }
  if (ev.key === 'Escape') {
    if (!$('#palette').hidden) { closePalette(); return; }
    if (settings.wall) { save({ wall: false }); return; }
    return;
  }
  const typing = ev.target.closest && ev.target.closest('input, textarea, select, [contenteditable]');
  if (!settings.shortcuts || typing || ev.metaKey || ev.ctrlKey || ev.altKey || !$('#palette').hidden) return;
  const k = ev.key.toLowerCase();
  if (Date.now() < gUntil) {
    gUntil = 0;
    const v = { o: 'overview', m: 'messages', h: 'history', s: 'settings' }[k];
    if (v) { ev.preventDefault(); go(v); }
    return;
  }
  if (k === 'g') { gUntil = Date.now() + 1200; return; }
  if (k === 'n') { ev.preventDefault(); go('messages'); $('#text').focus(); }
  else if (k === 'd') toggleDark();
  else if (k === 'w') save({ wall: !settings.wall });
  else if (ev.key === '/') { ev.preventDefault(); if (view === 'settings') { const s = $('[data-ctl="search"]'); if (s) s.focus(); } else openPalette(); }
  else if (ev.key === '?') go('settings/shortcuts');
});

// --- Settings applied -------------------------------------------------------------

function darkRender() {
  const on = isDark();
  for (const el of $$('[data-dark]')) el.setAttribute('aria-checked', String(on));
  for (const b of $$('[data-dark-btn]')) {
    b.title = t('theme.toggle');
    b.setAttribute('aria-label', t('theme.toggle'));
    b.setAttribute('aria-pressed', String(on));
    b.replaceChildren(icon(on ? 'SUN' : 'MOON'));
  }
}
function toggleDark() { save({ theme: isDark() ? 'light' : 'dark' }); }
for (const el of $$('[data-dark], [data-dark-btn]')) el.addEventListener('click', toggleDark);
darkQuery.addEventListener('change', () => { darkRender(); if (view === 'settings') settingsRender(); });

function applyLook(s) {  // everything visual, also for a live preview while a slider moves
  const root = document.documentElement, st = root.style, set = (k, v) => (v == null ? delete root.dataset[k] : (root.dataset[k] = v));
  set('theme', s.theme === 'system' ? null : s.theme);
  set('accent', s.accent);
  if (s.accent === 'custom') { st.setProperty('--accent', s.accentCustom); st.setProperty('--on-accent', readableOn(s.accentCustom)); }
  else { st.removeProperty('--accent'); st.removeProperty('--on-accent'); }
  set('density', s.density === 'compact' ? 'compact' : null);
  set('font', s.font === 'system' ? null : s.font);
  set('contrast', s.contrast ? 'high' : null);
  set('avatars', s.avatars === 'mono' ? 'mono' : null);
  set('motion', s.motion === 'system' ? null : s.motion);
  set('cards', s.layout === 'list' ? 'list' : null);
  set('toast', s.toastPos);
  set('bubbles', s.bubbles === 'list' ? 'list' : null);
  set('wall', s.wall ? 'on' : null);
  st.setProperty('--zoom', String(s.zoom / 100));
  st.setProperty('--radius', `${s.radius}px`);
  st.setProperty('--radius-s', `${Math.round(s.radius * 0.6)}px`);
  st.setProperty('--tint', s.tintColor);
  st.setProperty('--tint-o', `${s.tint}%`);
  for (const a of $$('[data-view="history"]')) a.hidden = !s.navHistory;
  $('#wall-exit').hidden = !s.wall;
}

function applySettings() {
  applyLook(settings);
  lang = settings.lang || autoLang();
  if (settings.wall && view !== 'overview') go('overview');
  langRender();
}

function langRender() {  // everything that is not redrawn from the data: static texts, titles, labels
  document.documentElement.lang = lang;
  setFormats();
  for (const el of $$('[data-t]')) el.textContent = t(el.dataset.t);
  for (const el of $$('[data-t-label]')) el.setAttribute('aria-label', t(el.dataset.tLabel));
  for (const el of $$('[data-l]')) el.textContent = L(JSON.parse(el.dataset.l));
  for (const el of $$('[data-l-label]')) { const v = L(JSON.parse(el.dataset.lLabel)); el.setAttribute('aria-label', v); el.title = v; }
  for (const b of $$('.seg button[data-filter]')) b.setAttribute('aria-pressed', String(b.dataset.filter === mailFilter));
  $('#keys').textContent = settings.enterSends ? t('form.keys.enter') : keysHint();
  $('#form-note').textContent = '';
  optionsKey = '';
  histKey = '';
  darkRender();
  liveRender();
  if (connKind && connKind !== 'ok') connection(connKind);
  if (view === 'settings') settingsRender();
  render();
}

// --- Events and start -------------------------------------------------------------

$$('.seg button[data-filter]').forEach((b) => b.addEventListener('click', () => {
  mailFilter = b.dataset.filter;
  for (const x of $$('.seg button[data-filter]')) x.setAttribute('aria-pressed', String(x === b));
  if (data) mailRender();
}));
$('#mail-person').addEventListener('change', (ev) => { mailPerson = ev.target.value; if (data) mailRender(); });
$('#hist-person').addEventListener('change', (ev) => { histPerson = ev.target.value; if (data) historyRender(); });
$('#hist-kind').addEventListener('change', (ev) => { histKind = ev.target.value; if (data) historyRender(); });
$('#to').addEventListener('change', () => { optionsKey = ''; recipients(); });
$('#text').addEventListener('input', () => { count(); grow(); if (settings.drafts) store('syn-draft', $('#text').value || null); });
$('#text').addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter' || ev.isComposing) return;
  const send = settings.enterSends ? !ev.shiftKey && !ev.metaKey && !ev.ctrlKey : ev.metaKey || ev.ctrlKey;
  if (send) { ev.preventDefault(); $('#compose').requestSubmit(); }
});
$('#wall-exit').addEventListener('click', () => save({ wall: false }));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  unread = 0;
  if (view === 'messages') unseenMail.clear();
  setTitle();
  load();
  setTimeout(() => { if (freshMail.size && data) { freshMail.clear(); if (view === 'messages') mailRender(); } }, 10000);
});
setInterval(() => {  // keep the relative times current
  if (data && !document.hidden && view !== 'settings') render();
  liveRender();
}, 30000);

icons();
if (settings.drafts) { $('#text').value = store('syn-draft') || ''; }
applySettings();
show(location.hash.replace(/^#\/?/, ''));
load();
</script>
</body>
</html>
